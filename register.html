<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Verabioma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            verabioma: '#40582E',
            'verabioma-claro': '#6F8B4A',
            beige: '#F4F1E7'
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-beige text-[#222]">
  <main class="mx-auto w-full max-w-3xl px-5 py-10 md:py-14">
    <section class="rounded-[2rem] bg-white p-7 shadow-sm sm:p-10 lg:p-12">
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-verabioma-claro">Únete a Verabioma</p>
      <h1 class="mt-2 text-3xl font-bold text-verabioma sm:text-4xl">Crear una cuenta</h1>
      <p class="mt-3 text-gray-600">Completa tus datos para registrarte.</p>
      <form class="mt-8 grid gap-5 sm:grid-cols-2" onsubmit="event.preventDefault(); registrarUsuarioPagina();">
        <div><label for="nombreRegistro" class="mb-2 block text-sm font-semibold">Nombre</label><input
            id="nombreRegistro" required autocomplete="given-name"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div><label for="apellidoRegistro" class="mb-2 block text-sm font-semibold">Apellido</label><input
            id="apellidoRegistro" required autocomplete="family-name"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><label for="correoRegistro" class="mb-2 block text-sm font-semibold">Correo
            electrónico</label><input id="correoRegistro" type="email" required autocomplete="email"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><label for="direccionRegistro"
            class="mb-2 block text-sm font-semibold">Dirección</label><input id="direccionRegistro" required
            autocomplete="street-address"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><label for="telefonoRegistro" class="mb-2 block text-sm font-semibold">Teléfono
            (mínimo 10 números)</label><input id="telefonoRegistro" type="tel" inputmode="numeric" required
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><label for="codigoPostalRegistro" class="mb-2 block text-sm font-semibold">Codigo Postal
            (mínimo 6 dígitos)</label><input id="codigoPostalRegistro" type="cod" inputmode="numeric" required
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><label for="descripcionDireRegistro" class="mb-2 block text-sm font-semibold">Descripcion Direccion
            (mínimo 100 Caracteres)</label><input id="descripcionDireRegistro" type="text" inputmode="text" required
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div><label for="passwordRegistro" class="mb-2 block text-sm font-semibold">Contraseña</label><input
            id="passwordRegistro" type="password" minlength="6" required autocomplete="new-password"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div><label for="confirmarRegistro" class="mb-2 block text-sm font-semibold">Confirmar contraseña</label><input
            id="confirmarRegistro" type="password" minlength="6" required autocomplete="new-password"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-verabioma focus:ring-2 focus:ring-verabioma/20">
        </div>
        <div class="sm:col-span-2"><button type="submit"
            class="w-full rounded-full bg-verabioma px-6 py-3 font-bold text-white transition hover:bg-verabioma-claro">Crear
            cuenta</button></div>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">¿Ya tienes cuenta? <a href="login.html"
          class="font-bold text-verabioma underline">Iniciar sesión</a></p>
    </section>
  </main>
  <script src="script-PP.js"></script>
</body>

</html>
